<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一级水平导航菜单</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 48px 20px;
            background: #f2f6f5;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        table {
            width: min(1120px, 100%);
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            background: #126b65;
            box-shadow: 0 12px 28px rgb(16 59 56 / 14%);
        }

        td {
            padding: 0;
            white-space: nowrap;
        }

        td + td {
            border-left: 1px solid rgb(255 255 255 / 18%);
        }

        a {
            display: block;
            padding: 17px 20px;
            color: #fff;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
            transition: background-color 160ms ease;
        }

        a:hover,
        a:focus-visible {
            background: #0b514d;
            outline: none;
        }

        @media (max-width: 760px) {
            body {
                padding: 24px 12px;
            }

            table {
                display: block;
                overflow-x: auto;
            }

            tr {
                display: table;
                width: max-content;
            }

            td {
                min-width: 120px;
            }

            a {
                padding: 15px 14px;
            }
        }

    </style>
</head>
<body>
    <table align="center">
        <tr>           
            <td><a href="#">首页</a></td>
            <td><a href="#">教学院(部)</a></td>
            <td><a href="#">党群机构</a></td>
            <td><a href="#">行政教辅机构</a></td>
            <td><a href="#">教学科研</a></td>
            <td><a href="#">招生就业</a></td>
            <td><a href="#">国际交流</a></td>
            <td><a href="#">数字图书馆</a></td>
        </tr>
    </table>
    
</body>
</html>
