<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二级水平导航菜单</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #203432;
            background: #f2f6f5;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body > ul:first-of-type {
            margin: 0;
            padding: 17px max(24px, calc((100% - 1120px) / 2));
            list-style: none;
            color: #fff;
            background: #126b65;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        body > ul:nth-of-type(2) {
            display: flex;
            width: 100%;
            margin: 0;
            padding: 0 max(12px, calc((100% - 1120px) / 2));
            list-style: none;
            background: #fff;
            box-shadow: 0 8px 20px rgb(16 59 56 / 10%);
        }

        body > ul:nth-of-type(2) > li {
            position: relative;
        }

        body > ul:nth-of-type(2) a {
            display: block;
            padding: 17px 18px;
            color: #203432;
            font-size: 15px;
            white-space: nowrap;
            text-decoration: none;
            transition: color 160ms ease, background-color 160ms ease;
        }

        body > ul:nth-of-type(2) > li > a:hover,
        body > ul:nth-of-type(2) > li > a:focus-visible {
            color: #fff;
            background: #126b65;
            outline: none;
        }

        body > ul:nth-of-type(2) > li > ul {
            position: absolute;
            z-index: 1;
            top: 100%;
            left: 0;
            display: none;
            min-width: 220px;
            margin: 0;
            padding: 6px 0;
            list-style: none;
            background: #fff;
            box-shadow: 0 12px 24px rgb(16 59 56 / 16%);
        }

        body > ul:nth-of-type(2) > li:hover > ul,
        body > ul:nth-of-type(2) > li:focus-within > ul {
            display: block;
        }

        body > ul:nth-of-type(2) > li > ul a {
            padding: 12px 16px;
        }

        body > ul:nth-of-type(2) > li > ul a:hover,
        body > ul:nth-of-type(2) > li > ul a:focus-visible {
            color: #126b65;
            background: #e8f2f0;
            outline: none;
        }

        @media (max-width: 760px) {
            body > ul:first-of-type {
                padding: 15px 18px;
            }

            body > ul:nth-of-type(2) {
                overflow-x: auto;
                padding: 0 8px;
            }
        }
    </style>
</head>
<body>
    <ul>
        <li class="logo">欢迎访问湖南文理学院</li>
    </ul>
    <ul>         
        <li><a href="#">首页</a></li>
        <li><a href="#">教学院(部)</a>
            <ul>
                <li><a href="#">计算机与电气工程学院</a></li>
                <li><a href="#">芙蓉学院</a></li>
            </ul>
        </li>
        <li><a href="#">党群机构</a></li>        
        <li><a href="#">行政教辅机构</a></li>
        <li><a href="#">教学科研</a></li>
        <li><a href="#">招生就业</a></li>
        <li><a href="#">国际交流</a></li>
        <li><a href="#">数字图书馆</a></li>
    </ul>    
</body>
</html>
